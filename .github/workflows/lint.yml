name: 💅 Lint

on:
    push:
        branches:
            - "main"
            - "dev"
        paths:
            - '**.go'
            - '**.mod'
            - '**.sum'
            - '.golangci.yaml'
            - '.github/workflows/**'
    pull_request:
        branches:
          - "main"
          - "dev"
        paths:
            - '**.go'
            - '**.mod'
            - '**.sum'
            - '.golangci.yaml'
            - '.github/workflows/**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            -
                name: Set up Go
                uses: actions/setup-go@v7
                with:
                    go-version:  '>=1.26'
                    cache: false
            -
                name: Code Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -
                name: golangci-lint
                uses: golangci/golangci-lint-action@v9
                with:
                    version: v2.12.0
                    args: --timeout 5m
                    working-directory: .
